{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container mt-5">
    <h2>My Cart</h2>
    <div id="cart-items">
        {% for order in cart_orders %}
        <div class="cart-item" data-order-id="{{ order.id }}">
            <h3>{{ order.book.title }}</h3>
            <p>Price: ${{ order.book.price }}</p>
            <div class="quantity-control">
                <button class="decrease-quantity">-</button>
                <input type="number" class="quantity-input" value="{{ order.quantity }}" min="1" max="{{ order.book.quantity }}">
                <button class="increase-quantity">+</button>
            </div>
            <button class="remove-item">Remove</button>
        </div>
        {% empty %}
        <p>Your cart is empty.</p>
        {% endfor %}
    </div>
    <div class="cart-total">
        <h3>Total: $<span id="cart-total-amount">0</span></h3>
    </div>
    <button id="send-cart" class="btn btn-primary">Send</button>
</div>

<link rel="stylesheet" href="{% static 'css/cart_style.css' %}">
{% endblock %}
